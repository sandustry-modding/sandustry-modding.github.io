<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sandustry Modding</title>
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Unofficial community docs for Sandustry modding: Sandkit API, guides, and the mod template kit. Not affiliated with Lantto Games or Hooded Horse."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.min.css"
    />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/api-cards.css" />
    <link rel="stylesheet" href="ui/ui-docs.css" />
    <script src="assets/heading-anchor.js"></script>
    <script src="assets/sidebar-headers.js"></script>
    <script src="assets/sidebar-groups.js"></script>
    <script src="assets/search-query.js"></script>
    <script src="assets/search-page.js"></script>
    <script src="assets/docs-settings.js"></script>
    <script src="ui/ui-canvas.js"></script>
  </head>
  <body class="loading sidebar-toggle-chevron">
    <div id="app"></div>
    <script>
      (function () {
        var hash = location.hash || "";
        if (
          hash === "#/modules" ||
          hash.indexOf("#/modules?") === 0 ||
          hash === "#/api/modules" ||
          hash.indexOf("#/api/modules?") === 0
        ) {
          location.hash = "#/types/search";
        } else if (hash === "#/api/full" || hash.indexOf("#/api/full?") === 0) {
          location.hash = "#/full";
        } else if (hash === "#/search" || hash.indexOf("#/search?") === 0) {
          location.hash = "#/types/search" + hash.slice("#/search".length);
        } else if (hash === "#/schemas" || hash.indexOf("#/schemas?") === 0) {
          location.hash = "#/types/schemas" + hash.slice("#/schemas".length);
        } else if (hash === "#/api/types" || hash.indexOf("#/api/types?") === 0) {
          location.hash = "#/types/" + hash.slice("#/api/types".length).replace(/^\?/, "?");
        } else if (hash === "#/tools" || hash.indexOf("#/tools?") === 0 || hash === "#/tools/") {
          location.replace("/tools/");
        } else if (hash === "#/tools/map" || hash.indexOf("#/tools/map") === 0) {
          location.replace("/tools/map/");
        } else if (/#\/(?:[^/?#]+\/)*README(?:\?|$)/.test(hash)) {
          location.hash = hash.replace(/\/README(?=\?|$)/, "/");
        }
      })();
      window.$docsify = {
        name: "Sandustry Modding",
        nameLink: "#/",
        loadSidebar: true,
        loadNavbar: true,
        mergeNavbar: true,
        subMaxLevel: 0,
        auto2top: true,
        noEmoji: true,
        alias: {
          "/docs/(.*)": "/$1",
          "/modkit/": "/modkit/README.md",
          "/guides/": "/guides/README.md",
          "/types/": "/types/README.md",
          "/ui/": "/ui/README.md",
          "/okf/": "/okf/index.md",
          "/okf/api/": "/okf/api/index.md",
          "/okf/world/": "/okf/world/index.md",
          "/okf/factory/": "/okf/factory/index.md",
          "/okf/energy/": "/okf/energy/index.md",
          "/okf/player/": "/okf/player/index.md",
          "/okf/ui/": "/okf/ui/index.md",
          "/okf/progression/": "/okf/progression/index.md",
          "/okf/entities/": "/okf/entities/index.md",
          "/okf/internals/": "/okf/internals/index.md",
          "/okf/live/": "/okf/live/index.md",
          "/okf/references/": "/okf/references/index.md",
          "/README": "/",
          "/guides/README": "/guides/",
          "/types/README": "/types/",
          "/ui/README": "/ui/",
          "/modkit/README": "/modkit/",
          "/okf/README": "/okf/",
          "/.*/_sidebar.md": "/_sidebar.md",
          "/.*/_navbar.md": "/_navbar.md",
          "/search": "/types/search",
          "search.md": "types/search.md",
          "/schemas": "/types/schemas",
          "schemas.md": "types/schemas.md",
          "/api/types": "/types/",
          "api/types.md": "types/README.md",
          "/ui/gallery": "/ui/",
          "ui/gallery.md": "ui/README.md",
          "/guides/modinfo": "/modinfo.json",
          "/guides/patches": "/patches.json",
          "guides/modinfo.md": "modinfo.json.md",
          "guides/patches.md": "patches.json.md",
        },
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              document.querySelectorAll("a[href]").forEach(function (a) {
                var href = a.getAttribute("href") || "";
                if (href === "#/tools" || href === "#/tools/" || href.indexOf("#/tools?") === 0) {
                  href = "/tools/";
                  a.setAttribute("href", href);
                }
                if (href === "#/tools/map" || href.indexOf("#/tools/map") === 0) {
                  href = "/tools/map/";
                  a.setAttribute("href", href);
                }
                if (href === "/tools" || href === "/tools/" || href.indexOf("/tools/") === 0) {
                  a.removeAttribute("target");
                }
              });
            });
          },
          function (hook) {
            hook.beforeEach(function (content) {
              var path = (window.location.hash || "").replace(/^#/, "").split("?")[0];
              if (path === "/modules" || path === "/api/modules") {
                window.location.hash = "#/types/search";
                return content;
              }
              if (path === "/api/full") {
                window.location.hash = "#/full";
                return content;
              }
              if (/^\/(?:[^/?#]+\/)*README$/.test(path)) {
                window.location.hash = "#" + path.replace(/\/README$/, "/") + (window.location.hash.split("?")[1] ? "?" + window.location.hash.split("?")[1] : "");
                return content;
              }
              return content;
            });
          },
          window.smtDocsifyHeadingCopyPlugin,
          window.smtDocsifySidebarHeadersPlugin,
          window.smtDocsifySidebarGroupsPlugin,
          window.smtDocsifySearchPlugin,
          window.smtDocsifyDocsSettingsPlugin,
          window.smtDocsifyUiCanvasPlugin,
        ].filter(function (p) {
          return typeof p === "function";
        }),
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
  </body>
</html>
